name: tests

on:
  push:
    branches: [master]
  pull_request:

jobs:
  pytest:
    # This project is Windows-native (WASAPI loopback, winrt mic-effects
    # probe, FluidSynth vendor/ layout) — run CI on the same OS the app
    # actually targets rather than papering over gaps with a Linux runner.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          # synctoolbox 1.4.1 pins numpy<2 / pandas<2 / music21<6, which
          # conflict with this project's modern stack — install without
          # its deps, same as the documented local setup (README.md).
          # The numpy-2 incompatibility is monkey-patched in
          # core/reference_builder.py.
          pip install --no-deps synctoolbox libfmp ipython

      - name: Run tests
        shell: pwsh
        run: python -m pytest tests/ -q
